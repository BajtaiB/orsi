<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orsi - Prémium Névjegykártya</title>
    
    <!-- Ikonkészlet betöltése (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Elegáns Google betűtípusok betöltése -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    
    <style>
        /* Szigorúan csak rózsaszín és fehér paletta */
        :root {
            --pure-white: #FFFFFF;        /* Hófehér */
            --blush-pink: #FFF5F8;        /* Leheletnyi rózsaszín háttér */
            --powder-pink: #FCE4EC;       /* Világos púderrózsaszín */
            --rose-pink: #F48FB1;         /* Középtónusú elegáns rózsaszín */
            --deep-rose: #D81B60;         /* Erőteljesebb rózsaszín az ikonokhoz */
            --dark-berry: #880E4F;        /* Nagyon sötét, elegáns rózsaszín (fekete helyett) */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--pure-white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: var(--dark-berry);
        }

        /* A fő kártya konténer - letisztult, keret nélküli hatás mobilra */
        .card-container {
            width: 100%;
            max-width: 420px;
            background: var(--pure-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 30px;
            box-sizing: border-box;
        }

        /* Profilkép stílusa - finom árnyékokkal és dupla kerettel */
        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--pure-white);
            outline: 2px solid var(--powder-pink);
            box-shadow: 0 12px 35px rgba(244, 143, 177, 0.4);
            margin-bottom: 25px;
            background-color: var(--blush-pink);
        }

        /* Név - klasszikus, magazin-stílusú tipográfia */
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: var(--dark-berry);
            text-align: center;
            letter-spacing: 1px;
        }

        /* Titulus és elválasztó vonal */
        .title {
            font-size: 12px;
            color: var(--deep-rose);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
        }

        .divider {
            width: 40px;
            height: 2px;
            background-color: var(--powder-pink);
            margin-bottom: 40px;
            border-radius: 2px;
        }

        /* Gombok tárolója */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Elegáns, pasztell rózsaszín gombok */
        .link-btn {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, var(--powder-pink), var(--rose-pink));
            color: var(--pure-white);
            text-decoration: none;
            padding: 10px 10px 10px 12px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(244, 143, 177, 0.25);
            border: 1px solid var(--pure-white);
        }

        .link-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(216, 27, 96, 0.3);
            background: linear-gradient(135deg, var(--rose-pink), var(--deep-rose));
        }

        /* Ikonok hófehér kör alakú háttere */
        .icon-wrapper {
            background: var(--pure-white);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
            font-size: 18px;
            color: var(--deep-rose);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .btn-text {
            flex-grow: 1;
            text-align: left;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- PROFILKÉP -->
    <img src="" alt="" class="profile-pic">

    <!-- NÉV ÉS TITULUS -->
    <h1 class="name">Orsi</h1>
    <p class="title">Trichocenter területi képviselő</p>
    <div class="divider"></div>

    <!-- GOMBOK ÉS ADATOK -->
    <div class="links-container">
        
        <!-- Telefonszám -->
        <a href="tel:+36303016293" class="link-btn">
            <div class="icon-wrapper"><i class="fas fa-phone"></i></div>
            <span class="btn-text">Hívás</span>
        </a>

        <!-- E-mail (Lenyíló modul indító gombja) -->
        <div class="link-btn" onclick="toggleEmail()">
            <div class="icon-wrapper"><i class="fas fa-envelope"></i></div>
            <span class="btn-text">E-mail cím</span>
        </div>
        
        <!-- Lenyíló e-mail másoló panel -->
        <div id="email-box" class="email-box">
            <span class="email-text">fitthaj@gmail.com</span>
            <button class="copy-btn" onclick="copyEmail()" id="copy-btn">
                <i class="fas fa-copy"></i> Másolás
            </button>
        </div>

        <!-- Facebook -->
        <a href="https://www.facebook.com/profile.php?id=100009124605034&locale=hu_HU" target="_blank" class="link-btn">
            <div class="icon-wrapper"><i class="fab fa-facebook-f"></i></div>
            <span class="btn-text">Facebook profil</span>
        </a>

    </div>
</div>

</body>
</html>
